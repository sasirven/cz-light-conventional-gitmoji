[project]
name = "cz-light-conventional-gitmoji"
version = "0.3.1"
description = "A commitizen plugin that combines gitmoji and conventional commits in a lightweight way."
authors = [
  { name = "sasirven", email = "77392535+sasirven@users.noreply.github.com" }
]
license = { text = "MIT" }
readme = "README.md"
repository = "https://github.com/sasirven/cz-light-conventional-gitmoji"
requires-python = ">=3.9"
dependencies = [
  "commitizen>=3.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/shared",
  "src/cz_light_gitmoji",
  "src/gitmojify"
]

[dependency-groups]
  dev = [
  "black>=24.8.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "coverage[toml]>=7.6.1",
]


[project.scripts]
gitmojify = "gitmojify.mojify:run"

[project.entry-points."commitizen.plugin"]
cz_light_gitmoji = "cz_light_gitmoji.main:CommitizenGitmojiCz"

[tool.commitizen]
name = "cz_light_gitmoji"
tag_format = "$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.black]
target-version = ["py39", "py310", "py311", "py312"]
line-length = 79

[tool.coverage.run]
branch = true
parallel = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
exclude_lines = [
  'if __name__ == "__main__":'
]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.pytest.ini_options]
addopts = """--color=yes --doctest-modules --exitfirst --failed-first \
  --strict-markers --strict-config --verbosity=2 \
  --junitxml=reports/pytest.xml --cov"""
testpaths = ["src", "tests"]
